<div class="flex flex-col gap-4">
  <p class="text-xl font-bold mb-4"> Wybierz departament </p>
  
  <div class="flex items-center gap-2">
    <button mat-raised-button color="primary" (click)="downloadExcel()" [disabled]="isDownloading()">

        <mat-spinner *ngIf="isDownloading()" diameter="20" color="accent"></mat-spinner>

    </button>
  </div>
  
  <app-departments></app-departments>
</div>
